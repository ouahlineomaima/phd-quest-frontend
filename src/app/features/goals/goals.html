<pq-page-header eyebrow="Keep your why in sight" title="Make room for what matters." subtitle="Turn a big ambition into a direction you can return to."><button class="button primary" disabled><pq-icon name="plus" />Add a goal</button></pq-page-header>
<div class="stack"><div class="goal-intro"><span class="icon-tile"><pq-icon name="target" /></span><p><strong>Small intentions. Meaningful direction.</strong><span>Two sample goals show the layout. Creating and saving goals comes later.</span></p><pq-badge tone="accent">Design preview</pq-badge></div><div class="grid-two">@for (goal of goals; track goal.title) { <pq-card><div class="row spread"><span class="icon-tile"><pq-icon [name]="goal.icon" /></span><pq-badge [tone]="goal.tone">{{ goal.category }}</pq-badge></div><h2 class="goal-title">{{ goal.title }}</h2><p class="goal-description">{{ goal.detail }}</p><div class="row spread small"><span class="muted">Sample progress</span><strong>{{ goal.percent }}%</strong></div><pq-progress [value]="goal.percent" [label]="'Demo goal: ' + goal.title" [tone]="goal.tone" /><div class="goal-footer"><pq-badge tone="muted">In progress · demo</pq-badge><span>Not saved</span></div></pq-card> }</div><pq-card class="empty-goal"><pq-empty-state icon="target" title="Your next goal starts here." message="There are no real goals in your workspace yet. Soon you'll be able to set a direction and track it at your own pace."><button class="button" disabled><pq-icon name="plus" />Create your first goal</button></pq-empty-state></pq-card></div>
